name: Build portable CLI

on:
  push:
    tags:
      - "portable-v*"

  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub Release tag to create, e.g. portable-v0.1.0"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 portable CLI
    runs-on: windows-2022

    env:
      TARGET: x86_64-pc-windows-msvc
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      IS_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc

      - name: Prepare FFmpeg and native dependencies
        shell: pwsh
        run: bun scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc

      - name: Build Cap CLI
        shell: pwsh
        run: cargo build --release -p cap --target $env:TARGET

      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          $out = "dist\cap-portable-windows-x64"

          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # The executable is target-specific.
          Copy-Item "target\$env:TARGET\release\cap.exe" "$out\cap.exe" -Force

          # Cap's setup script stages FFmpeg's runtime files here.
          Get-ChildItem "target\release" -Filter "*.dll" |
            Copy-Item -Destination $out -Force

          # Include any additional runtime DLLs Cargo generated beside cap.exe.
          Get-ChildItem "target\$env:TARGET\release" -Filter "*.dll" |
            Copy-Item -Destination $out -Force

          $requiredDlls = @(
            "avcodec-61.dll",
            "avdevice-61.dll",
            "avfilter-10.dll",
            "avformat-61.dll",
            "avutil-59.dll",
            "postproc-58.dll",
            "swresample-5.dll",
            "swscale-8.dll"
          )

          foreach ($dll in $requiredDlls) {
            if (-not (Test-Path "$out\$dll")) {
              throw "Portable package is missing required DLL: $dll"
            }
          }

          @"
          Cap Portable CLI for Windows x64

          No installation is required. Keep cap.exe and every DLL in this
          folder together.

          Examples:
            cap.exe targets --json
            cap.exe record start --screen <id> --system-audio --detach --json
            cap.exe record stop --id <recordingId> --json
            cap.exe export <recording.cap> --output output.mp4 --json
          "@ | Set-Content "$out\README.txt"

          Compress-Archive `
            -Path "$out\*" `
            -DestinationPath "dist\cap-portable-windows-x64.zip" `
            -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cap-portable-windows-x64
          path: dist/cap-portable-windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Cap Portable CLI ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: ${{ env.IS_PRERELEASE }}
          generate_release_notes: true
          files: dist/cap-portable-windows-x64.zip