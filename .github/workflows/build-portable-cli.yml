name: Build portable CLI

on:
  workflow_dispatch:
  push:
    tags:
      - "portable-v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Prepare FFmpeg and native dependencies
        shell: pwsh
        run: bun scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc

      - name: Build CLI
        shell: pwsh
        run: cargo build --release -p cap --target x86_64-pc-windows-msvc

      - name: Assemble portable folder
        shell: pwsh
        run: |
          $out = "dist\cap-portable-windows-x64"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Copy-Item "target\x86_64-pc-windows-msvc\release\cap.exe" "$out\cap.exe"

          Get-ChildItem "target\x86_64-pc-windows-msvc\release" -Filter "*.dll" |
            Copy-Item -Destination $out

          @"
          Run cap.exe from this folder.

          Examples:
            cap.exe targets --json
            cap.exe record start --screen <id> --system-audio --detach --json
            cap.exe record stop --id <recordingId> --json
            cap.exe export <recording.cap> --output output.mp4 --json
          "@ | Set-Content "$out\README.txt"

          Compress-Archive -Path "$out\*" -DestinationPath "dist\cap-portable-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: cap-portable-windows-x64
          path: dist/cap-portable-windows-x64.zip
          if-no-files-found: error